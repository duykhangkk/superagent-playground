<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Upscale</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
            <path d="M19 4v4"></path>
            <path d="M21 6h-4"></path>
          </svg>
        </div>
        <div class="title-group">
          <h1 class="title">YT Upscale</h1>
          <span class="subtitle">AMD FSR 1.0 + RCAS WebGL</span>
        </div>
      </div>
      <div class="toggle-wrapper">
        <label class="switch" title="Bật/Tắt Upscale">
          <input type="checkbox" id="toggleEnabled" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Split-Screen Quick Compare Mode -->
    <div class="compare-card">
      <div class="compare-info">
        <span class="compare-title">So sánh Trước / Sau</span>
        <span class="compare-desc">Chia đôi màn hình: Trái gốc | Phải FSR</span>
      </div>
      <label class="switch small" title="Bật chia đôi màn hình để thấy ngay sự khác biệt">
        <input type="checkbox" id="toggleSplitScreen">
        <span class="slider round"></span>
      </label>
    </div>

    <!-- Live Status Card -->
    <section class="status-card" id="statusCard">
      <div class="status-header">
        <div class="status-indicator">
          <span class="status-dot active" id="statusDot"></span>
          <span class="status-text" id="statusText">Đang Upscale</span>
        </div>
        <span class="fps-badge" id="fpsBadge">60 FPS</span>
      </div>

      <div class="metrics-grid">
        <div class="metric-item">
          <span class="metric-label">Độ phân giải gốc</span>
          <span class="metric-value" id="nativeRes">1080p</span>
        </div>
        <div class="arrow-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
        <div class="metric-item highlight">
          <span class="metric-label">Đầu ra WebGL</span>
          <span class="metric-value" id="outputRes">4K UHD</span>
        </div>
      </div>
      
      <!-- Warning for DRM if any -->
      <div class="drm-warning" id="drmWarning" style="display: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="drmText">Video bảo vệ bản quyền (DRM). Đang phát video gốc.</span>
      </div>
    </section>

    <!-- Controls Section -->
    <main class="controls">
      <!-- Độ sắc nét (RCAS Sharpening Slider) -->
      <div class="control-group">
        <div class="group-label-row">
          <label class="control-label" for="sliderSharpness">Độ sắc nét (RCAS Sharpening)</label>
          <span class="value-badge" id="sharpnessVal">75%</span>
        </div>
        <input type="range" class="range-slider" id="sliderSharpness" min="0" max="100" value="75" step="5">
        <div class="slider-labels">
          <span>0% (Tự nhiên)</span>
          <span>50%</span>
          <span>100% (Cực nét)</span>
        </div>
      </div>

      <!-- Tỉ lệ Scale -->
      <div class="control-group">
        <label class="control-label">Mục tiêu Super-Resolution</label>
        <div class="segmented-control three-col">
          <button type="button" class="segment-btn active" data-scale="2x" id="btn2x">
            2x (4K Ultra)
          </button>
          <button type="button" class="segment-btn" data-scale="1.5x" id="btn15x">
            1.5x (2K QHD)
          </button>
          <button type="button" class="segment-btn" data-scale="fit" id="btnFit">
            Khớp màn
          </button>
        </div>
      </div>

      <!-- Thuật toán -->
      <div class="control-group">
        <div class="group-label-row">
          <label class="control-label">Thuật toán tái tạo</label>
        </div>
        <div class="radio-cards">
          <label class="radio-card active" id="labelEASU">
            <input type="radio" name="algorithm" value="easu" checked>
            <div class="radio-content">
              <div class="card-title-row">
                <span class="card-name">AMD FSR 1.0 (EASU + RCAS)</span>
                <span class="card-tag best">Đề xuất</span>
              </div>
              <p class="card-desc">Lọc hướng gradient thích ứng + Khử mờ tương phản cao. Nổi bật viền chữ, mắt, chi tiết anime/game.</p>
            </div>
          </label>

          <label class="radio-card" id="labelLanczos">
            <input type="radio" name="algorithm" value="lanczos">
            <div class="radio-content">
              <div class="card-title-row">
                <span class="card-name">Lanczos-3 Sinc Resampling</span>
                <span class="card-tag">Toán học</span>
              </div>
              <p class="card-desc">Cửa sổ Sinc 36 tap quét ma trận. Chuyển tiếp mượt mà, màu sắc trung thực chuẩn điện ảnh.</p>
            </div>
          </label>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">
        <span class="save-indicator" id="saveIndicator">✓ Đã đồng bộ</span>
      </div>
      <div class="footer-right">
        <span class="version-tag">v1.1.0</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
