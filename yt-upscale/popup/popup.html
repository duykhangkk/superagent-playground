<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Upscale</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
            <path d="M19 4v4"></path>
            <path d="M21 6h-4"></path>
          </svg>
        </div>
        <div class="title-group">
          <h1 class="title">YT Upscale</h1>
          <span class="subtitle">WebGL Real-time AI</span>
        </div>
      </div>
      <div class="toggle-wrapper">
        <label class="switch" title="Bật/Tắt Upscale">
          <input type="checkbox" id="toggleEnabled" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Live Status Banner -->
    <section class="status-card" id="statusCard">
      <div class="status-header">
        <div class="status-indicator">
          <span class="status-dot active" id="statusDot"></span>
          <span class="status-text" id="statusText">Đang sẵn sàng</span>
        </div>
        <span class="fps-badge" id="fpsBadge">60 FPS</span>
      </div>

      <div class="metrics-grid">
        <div class="metric-item">
          <span class="metric-label">Độ phân giải gốc</span>
          <span class="metric-value" id="nativeRes">1080p</span>
        </div>
        <div class="arrow-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
        <div class="metric-item highlight">
          <span class="metric-label">Đầu ra WebGL</span>
          <span class="metric-value" id="outputRes">4K UHD</span>
        </div>
      </div>
      
      <!-- Warning for DRM if any -->
      <div class="drm-warning" id="drmWarning" style="display: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="drmText">Video bảo vệ bản quyền (DRM). Đang hiển thị bản gốc.</span>
      </div>
    </section>

    <!-- Controls Section -->
    <main class="controls">
      <!-- Thuật toán -->
      <div class="control-group">
        <div class="group-label-row">
          <label class="control-label">Thuật toán nội suy</label>
          <span class="info-tag" title="EASU: Tái tạo biên cạnh tốt nhất cho Anime & Game. Lanczos: Chuẩn toán học không làm biến dạng hình học.">Gợi ý</span>
        </div>
        <div class="radio-cards">
          <label class="radio-card active" id="labelEASU">
            <input type="radio" name="algorithm" value="easu" checked>
            <div class="radio-content">
              <div class="card-title-row">
                <span class="card-name">AMD FSR EASU</span>
                <span class="card-tag best">Đề xuất</span>
              </div>
              <p class="card-desc">Edge-Adaptive Spatial Upsampling. Giữ nét viền và khử răng cưa sắc bén.</p>
            </div>
          </label>

          <label class="radio-card" id="labelLanczos">
            <input type="radio" name="algorithm" value="lanczos">
            <div class="radio-content">
              <div class="card-title-row">
                <span class="card-name">Lanczos-3 Sinc</span>
                <span class="card-tag">Toán học</span>
              </div>
              <p class="card-desc">Cửa sổ Sinc 36 điểm lấy mẫu. Tái tạo màu sắc trung thực chuẩn điện ảnh.</p>
            </div>
          </label>
        </div>
      </div>

      <!-- Tỉ lệ Scale -->
      <div class="control-group">
        <label class="control-label">Mục tiêu độ phân giải</label>
        <div class="segmented-control">
          <button type="button" class="segment-btn active" data-scale="fit" id="btnFit">
            Khớp màn hình (Fit)
          </button>
          <button type="button" class="segment-btn" data-scale="2x" id="btn2x">
            Gấp đôi (2x Native)
          </button>
        </div>
        <p class="hint-text">
          <span class="hint-dot">💡</span> 
          <span><strong>Fit</strong> tự động scale khung hình lên khớp mật độ điểm ảnh của màn hình (hỗ trợ tối đa 2K/4K/Retina).</span>
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">
        <span class="save-indicator" id="saveIndicator">✓ Đã đồng bộ</span>
      </div>
      <div class="footer-right">
        <span class="version-tag">v1.0.0</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
